name: Diagnosis (temporary)

# TEMPORARY diagnostic. The answer is carried by each job's PASS/FAIL rather than
# by log text, because log downloads are blocked in the environment being debugged.
#   PASS = variable is SET and non-empty
#   FAIL = variable is EMPTY or absent
# Nothing here prints, echoes, or derives any part of a value: `test -n` only
# inspects the length and never emits it.
on:
  push:
    branches:
      - arena/1e1a8a1f-hagz-fantasy

permissions:
  contents: read

jobs:
  repo-vars-url:
    runs-on: ubuntu-latest
    steps:
      - name: vars.VITE_SUPABASE_URL non-empty?
        env:
          V: ${{ vars.VITE_SUPABASE_URL }}
        run: test -n "$V" && echo "SET"

  repo-vars-key:
    runs-on: ubuntu-latest
    steps:
      - name: vars.VITE_SUPABASE_ANON_KEY non-empty?
        env:
          V: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: test -n "$V" && echo "SET"

  repo-secrets-url:
    runs-on: ubuntu-latest
    steps:
      - name: secrets.VITE_SUPABASE_URL non-empty?
        env:
          V: ${{ secrets.VITE_SUPABASE_URL }}
        run: test -n "$V" && echo "SET"

  repo-secrets-key:
    runs-on: ubuntu-latest
    steps:
      - name: secrets.VITE_SUPABASE_ANON_KEY non-empty?
        env:
          V: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: test -n "$V" && echo "SET"
