name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:all

  postgres-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # This CI service is an isolated throwaway cluster. FINDING tests document
      # known vulnerabilities and must never be interpreted as a security pass.
      - run: npm run test:postgres:security
        env:
          HAGZ_DISPOSABLE_POSTGRES: 'yes'
          HAGZ_TEST_DATABASE_URL: postgresql://postgres:disposable-test-only@127.0.0.1:5432/postgres
